<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Liga da Resenha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-emerald-400 tracking-wider">⚽ LIGA DA RESENHA</h1>
            <p class="text-slate-400 text-sm mt-1">Faça login para acessar os palpites</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded text-sm {% if category == 'error' %}bg-red-500/20 text-red-300 border border-red-500/50{% else %}bg-emerald-500/20 text-emerald-300 border border-emerald-500/50{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Usuário</label>
                <input type="text" name="username" required class="w-full px-4 py-2 rounded bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Senha</label>
                <input type="password" name="password" required class="w-full px-4 py-2 rounded bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 font-bold rounded text-slate-950 transition">Entrar</button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Não tem uma conta? <a href="{{ url_for('cadastro') }}" class="text-emerald-400 hover:underline font-semibold">Cadastre-se grátis (Ganhe 10 créditos)</a>
        </p>
    </div>
</body>
</html>
